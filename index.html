<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Betoverde kersthal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07080d;
    --fg: #f4ead6;
    --muted: #b9ab90;
    --line: rgba(255, 220, 160, 0.25);
    --btn: rgba(255, 220, 160, 0.08);
    --btn-hover: rgba(255, 220, 160, 0.16);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #07080d; }
  }
  :root[data-theme="dark"] { --bg: #07080d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 40%, #1a1410 0%, var(--bg) 70%);
    background-color: var(--bg);
    color: var(--fg);
    font-family: "Cormorant Garamond", Georgia, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 12px 16px;
    overflow: hidden;
  }
  canvas {
    display: block;
    max-width: 100%;
    max-height: calc(100vh - 76px);
    height: auto;
    aspect-ratio: 1148 / 2040;
    border-radius: 10px;
    box-shadow: 0 0 0 1px var(--line), 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 120px rgba(255, 180, 80, 0.08);
  }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  button {
    font: inherit;
    font-size: 17px;
    font-style: italic;
    color: var(--fg);
    background: var(--btn);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 18px;
    cursor: pointer;
  }
  button:hover { background: var(--btn-hover); }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { font-size: 15px; font-style: italic; color: var(--muted); min-height: 1em; }
</style>
</head>
<body>
<canvas id="c" width="1148" height="2040" aria-label="Betoverde kersthal: toverstof tuigt de kerstbomen op met lichtjes, kerstballen en een gouden piek, en de arrenslee van de Kerstman vliegt voorbij"></canvas>
<div class="controls">
  <button id="replay">↻ Opnieuw</button>
  <button id="pause">❚❚ Pauze</button>
  <button id="record">⬇ Download als video</button>
</div>
<div id="status"></div>

<script>
(() => {
  const W = 1148, H = 2040;
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const img = new Image();
  img.src = 'kerstbomen.jpg';

  // Vaste willekeur, zodat elke ronde (en elke video) er hetzelfde uitziet
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  const k = W / 1125; // foto-coördinaten gemeten op 1125x2000
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp01 = t => Math.max(0, Math.min(1, t));
  const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const easeOutBack = t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

  // ---------- Bomen ----------
  const T = (ax, ay, by, hw, turns, start) => ({ ax: ax * k, ay: ay * k, by: by * k, hw: hw * k, turns, start });
  const trees = [
    T(412, 975, 1880, 215, 6.0, 3.2),   // midden voor (hoofdboom)
    T(835, 995, 1880, 225, 6.0, 5.0),   // rechts
    T(100, 1035, 1640, 150, 4.5, 6.8),  // links
    T(700, 1000, 1700, 170, 5.0, 8.4),  // midden rechts
    T(1052, 1185, 1800, 130, 4.0, 9.8), // helemaal rechts
    T(560, 1000, 1500, 110, 3.5, 11.0), // achter
  ];
  const DECO = 7.5; // seconden per boom

  function spiral(tr, u, phase = 0) {
    const yLin = tr.ay + (tr.by - tr.ay) * (0.05 + 0.9 * u);
    const half = tr.hw * ((yLin - tr.ay) / (tr.by - tr.ay)) * 0.95 + 3;
    const ph = u * tr.turns * Math.PI * 2 + phase;
    return { x: tr.ax + half * Math.sin(ph), y: yLin + half * 0.16 * Math.cos(ph), depth: Math.cos(ph), half };
  }

  // ---------- Sprites ----------
  function makeGlow(color, inner) {
    const s = document.createElement('canvas'); s.width = s.height = 128;
    const g = s.getContext('2d');
    const rg = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    rg.addColorStop(0, 'rgba(255,255,255,1)');
    rg.addColorStop(inner, color.replace('A', '1'));
    rg.addColorStop(0.35, color.replace('A', '0.35'));
    rg.addColorStop(0.7, color.replace('A', '0.08'));
    rg.addColorStop(1, color.replace('A', '0'));
    g.fillStyle = rg; g.fillRect(0, 0, 128, 128);
    return s;
  }
  const WARM = makeGlow('rgba(255,196,110,A)', 0.07);
  const GOLD = makeGlow('rgba(255,170,40,A)', 0.06);
  const SOFT = makeGlow('rgba(255,210,150,A)', 0.0);
  const RUBY = makeGlow('rgba(255,70,60,A)', 0.07);
  const ICE  = makeGlow('rgba(170,210,255,A)', 0.07);

  // Glazen kerstbal als sprite
  function makeBauble(base, light, dark) {
    const s = document.createElement('canvas'); s.width = s.height = 128;
    const g = s.getContext('2d');
    const rg = g.createRadialGradient(46, 44, 4, 64, 70, 60);
    rg.addColorStop(0, light); rg.addColorStop(0.45, base); rg.addColorStop(1, dark);
    g.fillStyle = rg; g.beginPath(); g.arc(64, 70, 54, 0, Math.PI * 2); g.fill();
    // band
    g.save(); g.beginPath(); g.arc(64, 70, 54, 0, Math.PI * 2); g.clip();
    g.strokeStyle = 'rgba(255,225,150,0.55)'; g.lineWidth = 4;
    g.beginPath(); g.ellipse(64, 70, 56, 14, 0, 0, Math.PI * 2); g.stroke();
    g.fillStyle = 'rgba(255,240,200,0.6)';
    for (let i = -3; i <= 3; i++) { g.beginPath(); g.arc(64 + i * 15, 70 + Math.cos(i * 0.5) * 2, 2.2, 0, Math.PI * 2); g.fill(); }
    g.restore();
    // glans
    const sh = g.createRadialGradient(44, 46, 0, 44, 46, 22);
    sh.addColorStop(0, 'rgba(255,255,255,0.9)'); sh.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = sh; g.beginPath(); g.ellipse(44, 46, 20, 14, -0.6, 0, Math.PI * 2); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.25)'; g.beginPath(); g.ellipse(86, 98, 10, 5, -0.7, 0, Math.PI * 2); g.fill();
    // dopje
    const cg = g.createLinearGradient(52, 0, 76, 0);
    cg.addColorStop(0, '#8a6a2a'); cg.addColorStop(0.5, '#ffe7a8'); cg.addColorStop(1, '#8a6a2a');
    g.fillStyle = cg; g.fillRect(54, 8, 20, 14);
    g.strokeStyle = '#d9b860'; g.lineWidth = 2.5; g.beginPath(); g.arc(64, 6, 5, 0, Math.PI * 2); g.stroke();
    return s;
  }
  const BAUBLES = [
    makeBauble('#b3121f', '#ff8a7a', '#3a0408'),
    makeBauble('#c9952b', '#fff1b8', '#4a3005'),
    makeBauble('#7d0f1f', '#e0596b', '#250207'),
    makeBauble('#1f5a3a', '#7fd6a0', '#06200f'),
    makeBauble('#d8d2c6', '#ffffff', '#5a5450'),
  ];

  // ---------- Decoratie per boom ----------
  trees.forEach((tr, ti) => {
    tr.lights = [];
    // lampjes op gelijke afstand langs de slinger
    const dense = [];
    let len = 0, prev = spiral(tr, 0);
    for (let i = 0; i <= 3000; i++) {
      const p = spiral(tr, i / 3000);
      len += Math.hypot(p.x - prev.x, p.y - prev.y); prev = p;
      dense.push({ u: i / 3000, len });
    }
    const gap = 17, n = Math.floor(len / gap);
    for (let i = 0, j = 0; i <= n; i++) {
      while (j < dense.length - 1 && dense[j].len < i * gap) j++;
      const u = dense[j].u, p = spiral(tr, u);
      const r = rnd();
      tr.lights.push({ u, x: p.x + (rnd() - 0.5) * 6, y: p.y + (rnd() - 0.5) * 6, depth: p.depth,
        spr: r < 0.78 ? WARM : r < 0.9 ? GOLD : r < 0.96 ? RUBY : ICE,
        ph: rnd() * 6.28, sp: 0.8 + rnd() * 2 });
    }
    // losse lichtjes diep in de boom voor diepte
    for (let i = 0; i < n * 0.45; i++) {
      const u = rnd(), y = tr.ay + (tr.by - tr.ay) * (0.08 + 0.88 * u);
      const half = tr.hw * ((y - tr.ay) / (tr.by - tr.ay)) * 0.85;
      tr.lights.push({ u, x: tr.ax + (rnd() * 2 - 1) * half, y, depth: -0.2 + rnd() * 0.6, spr: WARM,
        ph: rnd() * 6.28, sp: 0.5 + rnd() * 1.5, small: true });
    }
    tr.lights.sort((a, b) => a.u - b.u);
    // gouden slinger: tweede spiraal, iets verschoven
    tr.ribbon = [];
    for (let i = 0; i <= 400; i++) tr.ribbon.push(spiral(tr, i / 400, Math.PI * 0.9));
    // kerstballen
    tr.baubles = [];
    const nb = Math.round(tr.turns * 2.2 * (tr.hw / 200 + 0.4));
    for (let i = 0; i < nb; i++) {
      const u = 0.1 + 0.85 * rnd(), y = tr.ay + (tr.by - tr.ay) * (0.05 + 0.9 * u);
      const half = tr.hw * ((y - tr.ay) / (tr.by - tr.ay)) * 0.8;
      tr.baubles.push({ u, x: tr.ax + (rnd() * 2 - 1) * half, y, r: (13 + rnd() * 9) * (0.75 + 0.35 * (y - 1000) / 900),
        spr: BAUBLES[Math.floor(rnd() * BAUBLES.length)], sw: rnd() * 6.28 });
    }
  });

  // Extra kerstballen precies over de prijskaartjes heen
  const tagSpots = [
    [475, 1140, 0], [330, 1210, 0], [730, 1290, 3], [880, 1250, 1], [400, 1380, 0], [270, 1300, 0],
    [225, 1450, 0], [205, 1610, 0], [135, 1610, 2], [15, 1490, 2], [35, 1530, 2], [580, 1240, 3],
    [1045, 1240, 4], [930, 1155, 1], [725, 1230, 3], [890, 1070, 1], [560, 985, 5], [262, 1385, 0],
    [610, 1250, 3], [465, 1140, 0],
  ];
  tagSpots.forEach(([x, y, ti], i) => {
    const tr = trees[ti];
    tr.baubles.push({ u: clamp01((y * k - tr.ay) / (tr.by - tr.ay)), x: x * k, y: y * k + 4,
      r: y > 1200 ? 34 : 26, spr: BAUBLES[i % 4], sw: rnd() * 6.28 });
  });

  const progress = (tr, t) => clamp01((t - tr.start) / DECO);

  // ---------- Toverstof-deeltjes ----------
  const dust = [];
  function emit(x, y, n, spread = 1) {
    for (let i = 0; i < n; i++) {
      const a = rnd() * 6.28, v = (20 + rnd() * 80) * spread;
      dust.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 20, life: 0, max: 0.8 + rnd() * 1.4, s: 0.4 + rnd() * 0.9 });
    }
  }

  // ---------- Sneeuw & bokeh ----------
  const flakes = Array.from({ length: 220 }, () => ({ x: rnd() * W, y: rnd() * H, r: 0.8 + rnd() * 2.6, v: 25 + rnd() * 55, w: rnd() * 6.28 }));
  const bokeh = Array.from({ length: 26 }, () => ({ x: rnd() * W, y: 700 + rnd() * 1300, r: 30 + rnd() * 70, v: 6 + rnd() * 14, ph: rnd() * 6.28 }));

  // ---------- Arrenslee ----------
  function drawSleigh(x, y, s, t) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(-0.08);
    ctx.fillStyle = '#ffe2a0';
    ctx.shadowColor = 'rgba(255,190,90,0.95)'; ctx.shadowBlur = 18;
    // rendieren (vier stuks, galopperend)
    for (let i = 0; i < 4; i++) {
      const rx = 150 + i * 92, gal = Math.sin(t * 9 + i * 1.3);
      const ry = Math.sin(t * 4.5 + i) * 4;
      ctx.save(); ctx.translate(rx, ry);
      ctx.beginPath(); ctx.ellipse(0, 0, 30, 12, -0.05, 0, Math.PI * 2); ctx.fill();               // lijf
      ctx.beginPath(); ctx.moveTo(22, -6); ctx.quadraticCurveTo(34, -22, 38, -30); ctx.lineTo(46, -28);
      ctx.quadraticCurveTo(40, -14, 30, 2); ctx.fill();                                              // nek
      ctx.beginPath(); ctx.ellipse(46, -31, 10, 5.5, 0.35, 0, Math.PI * 2); ctx.fill();               // kop
      ctx.strokeStyle = '#ffe2a0'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
      ctx.beginPath();                                                                                // gewei
      ctx.moveTo(40, -35); ctx.quadraticCurveTo(34, -50, 26, -54); ctx.moveTo(35, -46); ctx.lineTo(42, -54);
      ctx.moveTo(43, -36); ctx.quadraticCurveTo(42, -52, 50, -58); ctx.moveTo(44, -48); ctx.lineTo(52, -50);
      ctx.stroke();
      ctx.lineWidth = 4;                                                                              // poten
      ctx.beginPath();
      ctx.moveTo(18, 6); ctx.lineTo(30 + gal * 10, 26 - Math.abs(gal) * 4);
      ctx.moveTo(12, 6); ctx.lineTo(22 - gal * 8, 28);
      ctx.moveTo(-18, 6); ctx.lineTo(-30 - gal * 10, 24);
      ctx.moveTo(-22, 4); ctx.lineTo(-14 + gal * 9, 28 - Math.abs(gal) * 4);
      ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-28, -4); ctx.lineTo(-38, -10); ctx.lineWidth = 3; ctx.stroke();    // staartje
      ctx.restore();
    }
    if (true) { // rode neus van de voorste
      ctx.save(); ctx.shadowColor = 'rgba(255,40,40,1)'; ctx.shadowBlur = 20; ctx.fillStyle = '#ff5050';
      ctx.beginPath(); ctx.arc(150 + 3 * 92 + 55, -28 + Math.sin(t * 4.5 + 3) * 4, 4.5, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
    // teugels
    ctx.strokeStyle = 'rgba(255,226,160,0.8)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(60, -38); ctx.quadraticCurveTo(250, -10, 150 + 3 * 92 + 40, -24); ctx.stroke();
    // slee
    ctx.beginPath();
    ctx.moveTo(-60, -40); ctx.quadraticCurveTo(-70, 0, -40, 6); ctx.lineTo(70, 6); ctx.quadraticCurveTo(92, 0, 94, -26);
    ctx.quadraticCurveTo(80, -14, 64, -14); ctx.lineTo(-30, -14); ctx.quadraticCurveTo(-46, -20, -48, -44); ctx.closePath(); ctx.fill();
    ctx.lineWidth = 3.5; ctx.beginPath(); // glijders
    ctx.moveTo(-60, 22); ctx.lineTo(96, 22); ctx.quadraticCurveTo(118, 22, 116, 4); ctx.quadraticCurveTo(114, -6, 104, -2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-30, 6); ctx.lineTo(-30, 22); ctx.moveTo(50, 6); ctx.lineTo(50, 22); ctx.stroke();
    // kerstman met cadeauzak
    ctx.beginPath(); ctx.arc(-30, -40, 22, 0, Math.PI * 2); ctx.fill();          // zak
    ctx.beginPath(); ctx.ellipse(20, -30, 18, 22, 0, 0, Math.PI * 2); ctx.fill(); // lijf
    ctx.beginPath(); ctx.arc(24, -60, 11, 0, Math.PI * 2); ctx.fill();            // hoofd
    ctx.beginPath(); ctx.moveTo(14, -66); ctx.quadraticCurveTo(26, -92, 4, -84); ctx.lineTo(34, -66); ctx.fill(); // muts
    ctx.beginPath(); ctx.arc(3, -84, 4, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(32, -38); ctx.quadraticCurveTo(46, -48 + Math.sin(t * 6) * 6, 58, -40); ctx.stroke(); // zwaaiende arm
    ctx.restore();
  }

  // ---------- Hoofdlus ----------
  const STAR_T = trees[0].start + DECO + 0.4;
  const SLEIGH_T = 22.5, SLEIGH_D = 7.5;
  const GREET_T = 27.5;
  const LOOP = 38;
  let t0 = performance.now(), paused = false, pausedAt = 0, last = -1;

  function frame(now) {
    const t = paused ? pausedAt : ((now - t0) / 1000) % LOOP;
    let dt = t - last; if (dt < 0 || dt > 0.1) { dt = 0.016; if (t < last) dust.length = 0; }
    last = t;
    render(t, paused ? 0 : dt);
    requestAnimationFrame(frame);
  }

  function render(t, dt) {
    const fadeIn = clamp01(t / 2.5);
    const fadeOut = clamp01((LOOP - t) / 1.5);
    const magic = fadeIn * fadeOut;
    const lit = trees.reduce((s, tr) => s + progress(tr, t), 0) / trees.length * fadeOut;

    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    if (img.complete && img.naturalWidth) ctx.drawImage(img, 0, 0, W, H);
    else { ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0, 0, W, H); }

    // Sprookjessfeer: warmer, dieper, de tl-buis wordt een zachte gloed
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = `rgba(${lerp(255, 120, magic * 0.6 + lit * 0.25) | 0}, ${lerp(255, 92, magic * 0.6 + lit * 0.25) | 0}, ${lerp(255, 78, magic * 0.6 + lit * 0.25) | 0}, 1)`;
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
    // tl-buizen dimmen tot een warme gloed
    for (const [tx, ty, tw] of [[655, 690, 280], [10, 575, 120]]) {
      ctx.save(); ctx.translate(tx * k, ty * k); ctx.rotate(0.1); ctx.scale(1, 0.22);
      const g1 = ctx.createRadialGradient(0, 0, 0, 0, 0, tw * 1.3);
      g1.addColorStop(0, `rgba(30, 14, 4, ${0.8 * magic})`); g1.addColorStop(0.6, `rgba(30, 14, 4, ${0.35 * magic})`); g1.addColorStop(1, 'rgba(30,14,4,0)');
      ctx.fillStyle = g1; ctx.fillRect(-tw * 1.4, -tw * 1.4, tw * 2.8, tw * 2.8);
      ctx.globalCompositeOperation = 'screen';
      const g2 = ctx.createRadialGradient(0, 0, 0, 0, 0, tw * 1.6);
      g2.addColorStop(0, `rgba(255, 160, 60, ${0.4 * magic})`); g2.addColorStop(1, 'rgba(255,150,60,0)');
      ctx.fillStyle = g2; ctx.fillRect(-tw * 1.7, -tw * 1.7, tw * 3.4, tw * 3.4);
      ctx.restore();
    }
    // vignet
    const vg = ctx.createRadialGradient(W / 2, H * 0.62, H * 0.25, W / 2, H * 0.55, H * 0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, `rgba(4,2,8,${0.75 * magic})`);
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

    // Zachte bokeh in de lucht
    ctx.globalCompositeOperation = 'lighter';
    for (const b of bokeh) {
      b.y -= b.v * dt; if (b.y < 600) b.y = 2000;
      ctx.globalAlpha = 0.06 * (0.4 + lit) * magic * (0.6 + 0.4 * Math.sin(t * 0.7 + b.ph));
      ctx.drawImage(SOFT, b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);
    }

    // Per boom: slinger, lichtjes, kerstballen
    for (const tr of trees) {
      const pr = progress(tr, t);
      if (pr <= 0) continue;
      // warme gloed van binnenuit
      ctx.globalAlpha = 0.22 * pr * fadeOut;
      const gw = tr.hw * 2.6, gh = (tr.by - tr.ay) * 1.15;
      ctx.drawImage(SOFT, tr.ax - gw / 2, tr.ay + (tr.by - tr.ay) * 0.55 - gh / 2, gw, gh);

      // gouden slinger
      ctx.globalCompositeOperation = 'source-over';
      const nR = Math.floor(tr.ribbon.length * clamp01(pr * 1.02 - 0.02));
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      for (let pass = 0; pass < 2; pass++) {
        ctx.beginPath();
        let open = false;
        for (let i = 0; i < nR; i++) {
          const p = tr.ribbon[i];
          if (p.depth > -0.05) { open ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); open = true; } else open = false;
        }
        ctx.globalAlpha = (pass ? 0.9 : 0.55) * fadeOut;
        ctx.strokeStyle = pass ? '#f6d27a' : '#7a5414';
        ctx.lineWidth = pass ? 2.2 : 6.5;
        ctx.stroke();
      }

      // kerstballen
      for (const b of tr.baubles) {
        const age = (pr - b.u) * DECO;
        if (age <= 0) continue;
        const sc = age < 0.6 ? easeOutBack(age / 0.6) : 1;
        const sway = Math.sin(t * 1.6 + b.sw) * 0.06;
        ctx.save(); ctx.translate(b.x, b.y - b.r); ctx.rotate(sway);
        ctx.globalAlpha = fadeOut;
        const R = b.r * sc;
        ctx.drawImage(b.spr, -R * 1.18, -R * 0.12, R * 2.36, R * 2.36);
        ctx.restore();
      }

      // lichtjes
      ctx.globalCompositeOperation = 'lighter';
      for (const L of tr.lights) {
        const age = (pr - L.u) * DECO;
        if (age <= 0) break;
        const flash = Math.max(0, 1 - age * 2.5);
        let a = 0.7 + 0.3 * Math.sin(t * L.sp + L.ph);
        if (t > GREET_T - 1) a = 0.55 + 0.45 * Math.sin(t * 3 - L.u * 40); // zachte golf in de finale
        const front = L.depth > -0.1 ? 1 : 0.25;
        a *= Math.min(1, age * 3) * front * fadeOut;
        const size = (L.small ? 26 : 40) * (1 + flash * 1.5) * (L.depth > -0.1 ? 1 : 0.7);
        ctx.globalAlpha = Math.min(1, a + flash);
        ctx.drawImage(L.spr, L.x - size / 2, L.y - size / 2, size, size);
      }
      ctx.globalCompositeOperation = 'source-over';

      // toverkomeet die de boom optuigt
      if (pr > 0 && pr < 1) {
        const p = spiral(tr, pr);
        if (dt > 0) emit(p.x, p.y, 3);
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 1;
        const s = 110 + Math.sin(t * 20) * 10;
        ctx.drawImage(GOLD, p.x - s / 2, p.y - s / 2, s, s);
        ctx.drawImage(WARM, p.x - 30, p.y - 30, 60, 60);
        ctx.globalCompositeOperation = 'source-over';
      }
    }

    // Gouden piek op de hoofdboom
    if (t > STAR_T - 0.8) {
      const tr = trees[0];
      const p = clamp01((t - (STAR_T - 0.8)) / 0.8);
      const sx = tr.ax, sy = lerp(tr.ay - 260, tr.ay - 12, easeInOut(p));
      if (p < 1 && dt > 0) emit(sx, sy, 4, 0.6);
      if (p >= 1 && t - STAR_T < 0.05 && dt > 0) emit(sx, sy, 90, 3);
      const r = 40 * (1 + Math.sin(t * 2.2) * 0.04);
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.9 * fadeOut;
      ctx.drawImage(GOLD, sx - r * 5, sy - r * 5, r * 10, r * 10);
      // stralen
      ctx.save(); ctx.translate(sx, sy); ctx.rotate(t * 0.15);
      for (let i = 0; i < 12; i++) {
        ctx.rotate(Math.PI / 6);
        const len = (i % 2 ? 110 : 170) * (0.85 + 0.15 * Math.sin(t * 2 + i));
        const g = ctx.createLinearGradient(0, 0, len, 0);
        g.addColorStop(0, `rgba(255,220,140,${0.35 * fadeOut})`); g.addColorStop(1, 'rgba(255,220,140,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, -3); ctx.lineTo(len, 0); ctx.lineTo(0, 3); ctx.fill();
      }
      ctx.restore();
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = fadeOut;
      ctx.save(); ctx.translate(sx, sy);
      const sg = ctx.createLinearGradient(-r, -r, r, r);
      sg.addColorStop(0, '#fff6d0'); sg.addColorStop(0.5, '#ffcf4a'); sg.addColorStop(1, '#b97a10');
      ctx.fillStyle = sg; ctx.strokeStyle = '#fff2c0'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const rr = i % 2 ? r * 0.42 : r, an = -Math.PI / 2 + i * Math.PI / 5;
        ctx.lineTo(Math.cos(an) * rr, Math.sin(an) * rr);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }

    // Arrenslee van de Kerstman vliegt langs het plafond
    if (t > SLEIGH_T && t < SLEIGH_T + SLEIGH_D) {
      const p = (t - SLEIGH_T) / SLEIGH_D;
      const x = lerp(W + 80, -900, p), y = 420 + Math.sin(p * Math.PI * 1.4) * 70 - p * 60;
      if (dt > 0) for (let i = 0; i < 3; i++) emit(x + 30 * 0.7, y + 10, 1, 0.4);
      ctx.globalAlpha = Math.min(1, Math.min(p, 1 - p) * 8);
      drawSleigh(x, y, 1.05, t);
      ctx.shadowBlur = 0;
    }

    // Toverstof
    ctx.globalCompositeOperation = 'lighter';
    for (let i = dust.length - 1; i >= 0; i--) {
      const d = dust[i];
      d.life += dt; if (d.life > d.max) { dust.splice(i, 1); continue; }
      d.x += d.vx * dt; d.y += d.vy * dt; d.vy += 40 * dt; d.vx *= 0.98;
      const a = (1 - d.life / d.max);
      ctx.globalAlpha = a * fadeOut;
      const s = 18 * d.s * (0.6 + 0.4 * Math.sin(d.life * 30 + i));
      ctx.drawImage(i % 3 ? GOLD : WARM, d.x - s / 2, d.y - s / 2, s, s);
    }
    if (dust.length > 2500) dust.splice(0, dust.length - 2500);

    // Sneeuw
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#fff8ec';
    for (const f of flakes) {
      f.y += f.v * dt; f.w += dt * 0.8;
      if (f.y > H + 5) { f.y = -5; f.x = rnd() * W; }
      ctx.globalAlpha = 0.7 * magic * (0.35 + 0.65 * Math.min(1, lit * 2));
      ctx.beginPath(); ctx.arc(f.x + Math.sin(f.w) * 14, f.y, f.r, 0, Math.PI * 2); ctx.fill();
    }

    // Teksten
    const title = (lines, a, y) => {
      if (a <= 0) return;
      ctx.save(); ctx.textAlign = 'center'; ctx.globalAlpha = a;
      ctx.shadowColor = 'rgba(255,170,60,0.9)'; ctx.shadowBlur = 28;
      let yy = y;
      for (const [txt, font, color] of lines) {
        ctx.font = font; ctx.fillStyle = color; ctx.fillText(txt, W / 2, yy); yy += parseInt(font.match(/(\d+)px/)[1]) * 1.05;
      }
      ctx.restore();
    };
    const introA = clamp01((t - 0.4) / 1.2) * clamp01((5.2 - t) / 1.2);
    title([
      ['Er was eens…', 'italic 500 58px "Cormorant Garamond", Georgia, serif', '#f6e6c4'],
      ['een betoverde kersthal', 'italic 500 58px "Cormorant Garamond", Georgia, serif', '#f6e6c4'],
    ], introA, 230);
    const greetA = clamp01((t - GREET_T) / 1.6) * fadeOut;
    title([
      ['Vrolijk Kerstfeest', '150px "Great Vibes", "Brush Script MT", cursive', '#ffe3a3'],
      ['en een sprankelend nieuwjaar', 'italic 500 50px "Cormorant Garamond", Georgia, serif', '#f6e6c4'],
    ], greetA, 250);

    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }

  // ---------- Bediening ----------
  const pauseBtn = document.getElementById('pause');
  const restart = () => { t0 = performance.now(); last = -1; paused = false; dust.length = 0; pauseBtn.textContent = '❚❚ Pauze'; };
  document.getElementById('replay').onclick = restart;
  pauseBtn.onclick = () => {
    if (paused) { t0 = performance.now() - pausedAt * 1000; paused = false; pauseBtn.textContent = '❚❚ Pauze'; }
    else { pausedAt = ((performance.now() - t0) / 1000) % LOOP; paused = true; pauseBtn.textContent = '▶ Verder'; }
  };

  // Video opnemen werkt alleen als de pagina los geopend wordt (niet in een ingesloten viewer)
  const recBtn = document.getElementById('record');
  const statusEl = document.getElementById('status');
  if (window.self !== window.top || !cv.captureStream || !window.MediaRecorder) recBtn.hidden = true;
  recBtn.onclick = () => {
    const types = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
    const mime = types.find(m => MediaRecorder.isTypeSupported(m)) || '';
    const rec = new MediaRecorder(cv.captureStream(30), mime ? { mimeType: mime, videoBitsPerSecond: 10e6 } : undefined);
    const chunks = [];
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = () => {
      const type = rec.mimeType || 'video/webm';
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(chunks, { type }));
      a.download = 'betoverde-kersthal.' + (type.includes('mp4') ? 'mp4' : 'webm');
      a.click();
      recBtn.disabled = false; statusEl.textContent = 'Video klaar!';
    };
    restart();
    recBtn.disabled = true;
    statusEl.textContent = `Bezig met opnemen… (${LOOP} seconden)`;
    rec.start();
    setTimeout(() => rec.stop(), LOOP * 1000 - 100);
  };

  // ?t=12 zet de animatie stil op een bepaald moment
  const qt = parseFloat(new URLSearchParams(location.search).get('t'));
  if (!isNaN(qt)) { paused = true; pausedAt = qt; }
  window.__setT = (t) => { paused = true; pausedAt = t; };

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
