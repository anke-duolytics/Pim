<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kerstbomen optuigen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0f14;
    --fg: #f4efe6;
    --muted: #b9b2a6;
    --accent: #c8202f;
    --btn: rgba(255, 255, 255, 0.1);
    --btn-hover: rgba(255, 255, 255, 0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0b0f14; }
  }
  :root[data-theme="dark"] { --bg: #0b0f14; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 12px 16px;
    overflow: hidden;
  }
  canvas {
    display: block;
    max-width: 100%;
    max-height: calc(100vh - 80px);
    height: auto;
    aspect-ratio: 1148 / 2040;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
  }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  button {
    font: inherit;
    font-size: 14px;
    color: var(--fg);
    background: var(--btn);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 999px;
    padding: 8px 16px;
    cursor: pointer;
  }
  button:hover { background: var(--btn-hover); }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { font-size: 13px; color: var(--muted); min-height: 1em; }
</style>
</head>
<body>
<canvas id="c" width="1148" height="2040" aria-label="Animatie: kerstmannen en kerstvrouwtjes tuigen de kerstbomen op met lampjes"></canvas>
<div class="controls">
  <button id="replay">↻ Opnieuw</button>
  <button id="pause">❚❚ Pauze</button>
  <button id="record">⬇ Download als video</button>
</div>
<div id="status"></div>

<script>
(() => {
  const W = 1148, H = 2040;
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const img = new Image();
  img.src = 'kerstbomen.jpg';

  // ---------- Bomen (coördinaten gemeten op de foto, 1125x2000) ----------
  const k = W / 1125;
  const T = (ax, ay, by, hw, turns) => ({ ax: ax * k, ay: ay * k, by: by * k, hw: hw * k, turns });
  const trees = [
    T(100, 1035, 1640, 150, 3.0),   // links
    T(412, 975, 1880, 215, 4.0),    // midden voor
    T(700, 1000, 1700, 170, 3.5),   // midden rechts
    T(835, 995, 1880, 225, 4.0),    // rechts
    T(1052, 1185, 1800, 130, 2.5),  // helemaal rechts
  ];

  // Positie op de slinger: u loopt van 0 (top) naar 1 (onderkant)
  function garland(tr, u) {
    const yLin = tr.ay + (tr.by - tr.ay) * (0.06 + 0.86 * u);
    const half = tr.hw * ((yLin - tr.ay) / (tr.by - tr.ay)) * 0.92 + 4;
    const ph = u * tr.turns * Math.PI * 2;
    const x = tr.ax + half * Math.sin(ph);
    const y = yLin + half * 0.18 * Math.cos(ph) + Math.sin(ph * 2) * 3;
    return { x, y, front: Math.cos(ph) > -0.15 };
  }

  const COLORS = ['#ff3b3b', '#ffd23f', '#3fa9ff', '#5dff7a', '#ff6ad5', '#fff2c4', '#ff8a2b'];
  // Gloeiende lampjes voorbereiden als sprites
  const glow = {};
  for (const c of COLORS) {
    const s = document.createElement('canvas'); s.width = s.height = 64;
    const g = s.getContext('2d');
    const rg = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    rg.addColorStop(0, '#ffffff');
    rg.addColorStop(0.15, c);
    rg.addColorStop(0.45, c + '55');
    rg.addColorStop(1, c + '00');
    g.fillStyle = rg; g.fillRect(0, 0, 64, 64);
    glow[c] = s;
  }

  // Lampjes per boom
  trees.forEach((tr, ti) => {
    tr.bulbs = [];
    const n = Math.round(tr.turns * 22);
    for (let i = 0; i <= n; i++) {
      const u = i / n;
      const p = garland(tr, u);
      tr.bulbs.push({ u, x: p.x, y: p.y, front: p.front,
        c: COLORS[(i + ti * 2) % COLORS.length], ph: Math.random() * 6.28, sp: 1.5 + Math.random() * 2.5 });
    }
  });

  // ---------- Personages ----------
  // type: 'man' (kerstman) of 'vrouw' (kerstvrouwtje)
  const GROUND = 1985;
  const cast = [
    { type: 'vrouw', tree: 0, start: 0.5, from: -120 },
    { type: 'man',   tree: 1, start: 1.5, from: -120 },
    { type: 'vrouw', tree: 2, start: 2.5, from: W + 120 },
    { type: 'man',   tree: 3, start: 3.2, from: W + 120 },
    { type: 'man',   tree: 4, start: 4.0, from: W + 120 },
    { type: 'vrouw', tree: 1, start: 21.5, from: -120, star: true },
  ];
  const WALK = 3.2, JUMP = 1.1, DECO_PER_TURN = 2.6, LEAP = 1.0, CHEER = 1.6, EXIT = 3.2;
  cast.forEach(c => {
    const tr = trees[c.tree];
    c.baseX = tr.ax + (c.from < 0 ? -1 : 1) * (tr.hw * 0.55);
    c.deco = c.star ? 1.6 : tr.turns * DECO_PER_TURN;
    c.tWalk = c.start;
    c.tJump = c.tWalk + WALK;
    c.tDeco = c.tJump + JUMP;
    c.tLeap = c.tDeco + c.deco;
    c.tCheer = c.tLeap + LEAP;
    c.tExit = c.tCheer + CHEER;
    c.tEnd = c.tExit + EXIT;
  });
  const STAR_TIME = cast[5].tLeap;
  const FINALE = Math.max(...cast.map(c => c.tEnd));
  const LOOP = FINALE + 6;

  const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp01 = t => Math.max(0, Math.min(1, t));

  // Voortgang van het optuigen per boom (0..1) op tijd t
  function progress(ti, t) {
    const c = cast.find(c => c.tree === ti && !c.star);
    return clamp01((t - c.tDeco) / c.deco);
  }

  function charState(c, t) {
    const tr = trees[c.tree];
    if (t < c.tWalk || t > c.tEnd) return null;
    const scaleAt = y => 0.62 + 0.38 * clamp01((y - 1000) / (GROUND - 1000));
    const topP = c.star ? { x: tr.ax + (c.from < 0 ? -1 : 1) * 30, y: tr.ay + 40 } : garland(tr, 0);
    if (t < c.tJump) {
      const p = ease((t - c.tWalk) / WALK);
      const x = lerp(c.from, c.baseX, p);
      return { x, y: GROUND, s: 1, pose: 'walk', dir: c.from < 0 ? 1 : -1, ph: t * 9 };
    }
    if (t < c.tDeco) {
      const p = (t - c.tJump) / JUMP, e = ease(p);
      const x = lerp(c.baseX, topP.x, e);
      const y = lerp(GROUND, topP.y + 30, e) - Math.sin(p * Math.PI) * 220;
      return { x, y, s: lerp(1, scaleAt(topP.y), e), pose: 'jump', dir: topP.x > c.baseX ? 1 : -1, ph: 0 };
    }
    if (t < c.tLeap) {
      if (c.star) {
        return { x: topP.x, y: topP.y + 30 + Math.sin(t * 6) * 4, s: scaleAt(topP.y), pose: 'reach', dir: c.from < 0 ? 1 : -1, ph: t * 6, holdStar: true };
      }
      const u = (t - c.tDeco) / c.deco;
      const p = garland(tr, u), p2 = garland(tr, Math.min(1, u + 0.01));
      return { x: p.x, y: p.y + 26 - Math.abs(Math.sin(t * 7)) * 10, s: scaleAt(p.y), pose: 'string',
               dir: p2.x >= p.x ? 1 : -1, ph: t * 7, behind: !p.front };
    }
    const endP = c.star ? topP : garland(tr, 1);
    if (t < c.tCheer) {
      const p = (t - c.tLeap) / LEAP, e = ease(p);
      const x = lerp(endP.x, c.baseX, e);
      const y = lerp(endP.y + 26, GROUND, e) - Math.sin(p * Math.PI) * 140;
      return { x, y, s: lerp(scaleAt(endP.y), 1, e), pose: 'jump', dir: c.from < 0 ? 1 : -1, ph: 0 };
    }
    if (t < c.tExit) {
      return { x: c.baseX, y: GROUND - Math.abs(Math.sin((t - c.tCheer) * 6)) * 24, s: 1, pose: 'cheer', dir: 1, ph: t * 10 };
    }
    const p = ease((t - c.tExit) / EXIT);
    return { x: lerp(c.baseX, c.from, p), y: GROUND, s: 1, pose: 'walk', dir: c.from < 0 ? -1 : 1, ph: t * 9 };
  }

  // ---------- Tekenen van een kerstman / kerstvrouwtje ----------
  function drawCharacter(c, st, t) {
    const S = 1.25 * st.s;
    ctx.save();
    ctx.translate(st.x, st.y);
    ctx.scale(S * st.dir, S);
    if (st.behind) ctx.globalAlpha = 0.55;
    const red = '#d1202f', dark = '#8e1220', white = '#fbf7f0', skin = '#f6c7a5', boot = '#231a17';
    const isMan = c.type === 'man';
    const sw = st.pose === 'walk' ? Math.sin(st.ph) : 0;

    // schaduw
    if (st.pose === 'walk' || st.pose === 'cheer') {
      ctx.save(); ctx.globalAlpha *= 0.35; ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.ellipse(0, 2, 38, 8, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
    // benen + laarzen
    const leg = (dx, a) => {
      ctx.save(); ctx.translate(dx, -40); ctx.rotate(a);
      ctx.fillStyle = isMan ? red : '#2f2a2a';
      ctx.fillRect(-7, 0, 14, 28);
      ctx.fillStyle = boot;
      ctx.beginPath(); ctx.roundRect(-9, 24, 22, 14, 5); ctx.fill();
      ctx.restore();
    };
    const legA = st.pose === 'jump' ? 0.5 : sw * 0.5;
    leg(-11, legA); leg(11, -legA);

    // lichaam
    ctx.fillStyle = red;
    ctx.beginPath();
    if (isMan) {
      ctx.ellipse(0, -72, 36, 40, 0, 0, Math.PI * 2);
    } else {
      ctx.moveTo(-18, -108); ctx.lineTo(18, -108); ctx.lineTo(38, -36); ctx.quadraticCurveTo(0, -28, -38, -36); ctx.closePath();
    }
    ctx.fill();
    if (isMan) {
      ctx.fillStyle = white; ctx.fillRect(-5, -110, 10, 74);
      ctx.fillStyle = '#1b1414'; ctx.fillRect(-36, -70, 72, 11);
      ctx.fillStyle = '#f2c33d'; ctx.fillRect(-9, -72, 18, 15);
      ctx.fillStyle = '#1b1414'; ctx.fillRect(-4, -68, 8, 7);
    } else {
      // schort
      ctx.fillStyle = white;
      ctx.beginPath(); ctx.moveTo(-12, -90); ctx.lineTo(12, -90); ctx.lineTo(22, -40); ctx.quadraticCurveTo(0, -34, -22, -40); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#3d8b4f'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-20, -46); ctx.quadraticCurveTo(0, -40, 20, -46); ctx.stroke();
      ctx.fillStyle = white; ctx.beginPath(); ctx.ellipse(0, -36, 40, 6, 0, 0, Math.PI * 2); ctx.fill();
    }

    // armen
    const arm = (side, a) => {
      ctx.save(); ctx.translate(side * 24, -98); ctx.rotate(a);
      ctx.fillStyle = red; ctx.beginPath(); ctx.roundRect(-7, 0, 14, 34, 7); ctx.fill();
      ctx.fillStyle = white; ctx.fillRect(-8, 28, 16, 6);
      ctx.fillStyle = isMan ? '#1b1414' : '#3d8b4f';
      ctx.beginPath(); ctx.arc(0, 40, 8, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    };
    let aL, aR;
    switch (st.pose) {
      case 'walk': aL = sw * 0.5 + 0.2; aR = -sw * 0.5 - 0.2; break;
      case 'jump': aL = 2.6; aR = -2.6; break;
      case 'cheer': aL = 2.7 + Math.sin(st.ph) * 0.3; aR = -2.7 - Math.sin(st.ph) * 0.3; break;
      case 'reach': aL = 0.4; aR = -2.6 - Math.sin(st.ph) * 0.15; break;
      case 'string': aL = 0.5; aR = -1.6 + Math.sin(st.ph) * 0.4; break;
      default: aL = 0.2; aR = -0.2;
    }
    arm(-1, aL); arm(1, aR);

    // hoofd
    ctx.fillStyle = skin;
    ctx.beginPath(); ctx.arc(0, -128, 22, 0, Math.PI * 2); ctx.fill();
    if (isMan) {
      // baard
      ctx.fillStyle = white;
      ctx.beginPath();
      ctx.moveTo(-22, -130); ctx.quadraticCurveTo(-26, -90, 0, -84); ctx.quadraticCurveTo(26, -90, 22, -130);
      ctx.quadraticCurveTo(0, -118, -22, -130); ctx.fill();
      ctx.beginPath(); ctx.ellipse(-7, -121, 9, 5, 0.3, 0, Math.PI * 2); ctx.ellipse(7, -121, 9, 5, -0.3, 0, Math.PI * 2); ctx.fill();
    } else {
      // haar + knotje
      ctx.fillStyle = '#e9e4dc';
      ctx.beginPath(); ctx.arc(0, -134, 23, Math.PI * 1.05, Math.PI * 1.95); ctx.fill();
      ctx.beginPath(); ctx.arc(-20, -126, 8, 0, Math.PI * 2); ctx.arc(20, -126, 8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#e88f8f'; ctx.globalAlpha *= 0.6;
      ctx.beginPath(); ctx.arc(-11, -120, 5, 0, Math.PI * 2); ctx.arc(11, -120, 5, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = st.behind ? 0.55 : 1;
      ctx.fillStyle = '#c0392b';
      ctx.beginPath(); ctx.arc(0, -116, 4, 0, Math.PI); ctx.fill();
    }
    // ogen + neus
    ctx.fillStyle = '#2a1d18';
    const blink = (Math.sin(t * 1.3 + c.start * 7) > 0.97) ? 1 : 4;
    ctx.beginPath(); ctx.ellipse(-8, -131, 3, blink, 0, 0, Math.PI * 2); ctx.ellipse(8, -131, 3, blink, 0, 0, Math.PI * 2); ctx.fill();
    if (!isMan) {
      ctx.strokeStyle = '#8a6d3b'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(-8, -131, 7, 0, Math.PI * 2); ctx.moveTo(15, -131); ctx.arc(8, -131, 7, 0, Math.PI * 2); ctx.moveTo(-1, -131); ctx.lineTo(1, -131); ctx.stroke();
    }
    ctx.fillStyle = '#e8907a';
    ctx.beginPath(); ctx.arc(0, -124, 5, 0, Math.PI * 2); ctx.fill();

    // muts
    ctx.fillStyle = red;
    const tip = st.pose === 'walk' ? Math.sin(st.ph) * 4 : 0;
    ctx.beginPath(); ctx.moveTo(-23, -144); ctx.quadraticCurveTo(-4, -190, 32 + tip, -168); ctx.quadraticCurveTo(10, -170, 23, -144); ctx.closePath(); ctx.fill();
    ctx.fillStyle = white;
    ctx.beginPath(); ctx.roundRect(-26, -150, 52, 12, 6); ctx.fill();
    ctx.beginPath(); ctx.arc(33 + tip, -166, 8, 0, Math.PI * 2); ctx.fill();
    if (!isMan) {
      ctx.fillStyle = '#3d8b4f';
      ctx.beginPath(); ctx.ellipse(-12, -150, 6, 3, 0.5, 0, Math.PI * 2); ctx.ellipse(-4, -151, 6, 3, -0.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#e02a3a'; ctx.beginPath(); ctx.arc(-8, -148, 3, 0, Math.PI * 2); ctx.fill();
    }

    // lichtsnoer in de hand
    if (st.pose === 'string' || (st.pose === 'walk' && t < c.tJump && !c.star) || (st.pose === 'jump' && t < c.tDeco && !c.star)) {
      ctx.strokeStyle = '#1e3a1e'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(-34, -60, 18, 0, Math.PI * 2); ctx.stroke();
      for (let i = 0; i < 6; i++) {
        const a = i / 6 * Math.PI * 2 + t;
        ctx.fillStyle = COLORS[i % COLORS.length];
        ctx.beginPath(); ctx.arc(-34 + Math.cos(a) * 18, -60 + Math.sin(a) * 18, 3.5, 0, Math.PI * 2); ctx.fill();
      }
    }
    // ster vasthouden
    if (c.star && t < c.tLeap) {
      ctx.save(); ctx.translate(28, -168); ctx.rotate(t * 2);
      drawStar(0, 0, 18, 1);
      ctx.restore();
    }
    ctx.restore();
  }

  function drawStar(x, y, r, a) {
    ctx.save(); ctx.globalAlpha *= a;
    ctx.fillStyle = '#ffd94a'; ctx.strokeStyle = '#fff6c0'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const rr = i % 2 ? r * 0.45 : r;
      const an = -Math.PI / 2 + i * Math.PI / 5;
      ctx.lineTo(x + Math.cos(an) * rr, y + Math.sin(an) * rr);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  // ---------- Sneeuw ----------
  const flakes = Array.from({ length: 160 }, () => ({
    x: Math.random() * W, y: Math.random() * H, r: 1 + Math.random() * 3.2, v: 30 + Math.random() * 70, w: Math.random() * 6.28,
  }));

  // ---------- Hoofdlus ----------
  let t0 = performance.now(), paused = false, pausedAt = 0, last = 0;
  const statusEl = document.getElementById('status');

  function frame(now) {
    const t = paused ? pausedAt : ((now - t0) / 1000) % LOOP;
    const dt = Math.min(0.05, Math.max(0, t - last)); last = t;
    render(t, dt);
    requestAnimationFrame(frame);
  }

  function render(t, dt) {
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    if (img.complete && img.naturalWidth) ctx.drawImage(img, 0, 0, W, H);
    else { ctx.fillStyle = '#111'; ctx.fillRect(0, 0, W, H); }

    // Hoe meer lampjes aan, hoe sfeervoller (donkerder) de hal
    const lit = trees.reduce((s, _, i) => s + progress(i, t), 0) / trees.length;
    const fadeOut = t > LOOP - 1.2 ? (LOOP - t) / 1.2 : 1;
    const dim = (0.12 + 0.38 * lit) * fadeOut;
    ctx.fillStyle = `rgba(5, 8, 20, ${dim})`; ctx.fillRect(0, 0, W, H);

    // Snoer (draad) en lampjes
    trees.forEach((tr, ti) => {
      const pr = progress(ti, t) * (t > LOOP - 1.2 ? fadeOut : 1);
      if (pr <= 0) return;
      ctx.strokeStyle = 'rgba(25, 45, 25, 0.8)'; ctx.lineWidth = 2;
      ctx.beginPath();
      const steps = Math.ceil(240 * pr);
      for (let i = 0; i <= steps; i++) {
        const p = garland(tr, (i / 240));
        if (i && p.front) ctx.lineTo(p.x, p.y); else ctx.moveTo(p.x, p.y);
      }
      ctx.stroke();
    });
    ctx.globalCompositeOperation = 'lighter';
    const finale = t > FINALE - 3;
    trees.forEach((tr, ti) => {
      const pr = progress(ti, t);
      for (let i = 0; i < tr.bulbs.length; i++) {
        const b = tr.bulbs[i];
        if (b.u > pr) break;
        const age = (pr - b.u) * 20;
        let a = 0.55 + 0.45 * Math.sin(t * b.sp + b.ph);
        if (finale) a = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 6 - i * 0.6)); // looplicht in de finale
        a *= Math.min(1, age) * (b.front ? 1 : 0.3) * fadeOut;
        const pop = 1 + Math.max(0, 1 - age) * 1.2;
        const size = 46 * pop * (0.7 + 0.3 * a);
        ctx.globalAlpha = a;
        ctx.drawImage(glow[b.c], b.x - size / 2, b.y - size / 2, size, size);
      }
    });
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    // Ster op de middelste boom
    if (t > STAR_TIME) {
      const tr = trees[1];
      const p = clamp01((t - STAR_TIME) / 0.6);
      const r = 34 * (p < 1 ? 1 + Math.sin(p * Math.PI) * 0.8 : 1 + Math.sin(t * 3) * 0.06);
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.8 * fadeOut;
      ctx.drawImage(glow['#ffd23f'], tr.ax - r * 4, tr.ay - 8 - r * 4, r * 8, r * 8);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      ctx.save(); ctx.translate(tr.ax, tr.ay - 8); ctx.rotate(Math.sin(t * 1.5) * 0.08);
      drawStar(0, 0, r, fadeOut); ctx.restore();
      // vonkjes
      if (p < 1) {
        for (let i = 0; i < 18; i++) {
          const an = i / 18 * Math.PI * 2, d = p * 160;
          ctx.globalAlpha = 1 - p;
          ctx.fillStyle = COLORS[i % COLORS.length];
          ctx.beginPath(); ctx.arc(tr.ax + Math.cos(an) * d, tr.ay - 8 + Math.sin(an) * d, 5, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
    }

    // Personages (achter de boom eerst)
    const states = cast.map(c => [c, charState(c, t)]).filter(([, s]) => s);
    states.sort((a, b) => (b[1].behind ? 1 : 0) - (a[1].behind ? 1 : 0) || a[1].y - b[1].y);
    for (const [c, s] of states) drawCharacter(c, s, t);

    // Sneeuw
    ctx.fillStyle = '#ffffff';
    for (const f of flakes) {
      f.y += f.v * dt; f.w += dt;
      if (f.y > H + 5) { f.y = -5; f.x = Math.random() * W; }
      ctx.globalAlpha = 0.75 * (0.5 + 0.5 * lit) * fadeOut;
      ctx.beginPath(); ctx.arc(f.x + Math.sin(f.w) * 12, f.y, f.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Titel aan het begin, groet aan het eind
    const banner = (txt, sub, a, y) => {
      if (a <= 0) return;
      ctx.save(); ctx.globalAlpha = a; ctx.textAlign = 'center';
      ctx.font = '700 104px "Mountains of Christmas", Georgia, serif';
      ctx.lineWidth = 10; ctx.strokeStyle = 'rgba(80, 0, 10, 0.85)'; ctx.strokeText(txt, W / 2, y);
      const g = ctx.createLinearGradient(0, y - 90, 0, y);
      g.addColorStop(0, '#fff3c4'); g.addColorStop(1, '#ffc13b');
      ctx.fillStyle = g; ctx.fillText(txt, W / 2, y);
      if (sub) {
        ctx.font = '700 54px "Mountains of Christmas", Georgia, serif';
        ctx.lineWidth = 6; ctx.strokeText(sub, W / 2, y + 74);
        ctx.fillStyle = '#ffffff'; ctx.fillText(sub, W / 2, y + 74);
      }
      ctx.restore();
    };
    banner('Tijd om op te tuigen!', null, clamp01(t / 0.6) * clamp01((4 - t) / 0.8), 260);
    const ga = clamp01((t - (FINALE - 4)) / 1.2) * fadeOut;
    banner('Vrolijk Kerstfeest!', 'en een stralend nieuwjaar', ga, 250);
  }

  // ---------- Bediening ----------
  document.getElementById('replay').onclick = () => { t0 = performance.now(); last = 0; paused = false; pauseBtn.textContent = '❚❚ Pauze'; };
  const pauseBtn = document.getElementById('pause');
  pauseBtn.onclick = () => {
    if (paused) { t0 = performance.now() - pausedAt * 1000; paused = false; pauseBtn.textContent = '❚❚ Pauze'; }
    else { pausedAt = ((performance.now() - t0) / 1000) % LOOP; paused = true; pauseBtn.textContent = '▶ Verder'; }
  };

  const recBtn = document.getElementById('record');
  recBtn.onclick = () => {
    if (!cv.captureStream || !window.MediaRecorder) { statusEl.textContent = 'Video opnemen wordt in deze browser niet ondersteund.'; return; }
    const types = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
    const mime = types.find(m => MediaRecorder.isTypeSupported(m)) || '';
    const rec = new MediaRecorder(cv.captureStream(30), mime ? { mimeType: mime, videoBitsPerSecond: 8e6 } : undefined);
    const chunks = [];
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = () => {
      const type = rec.mimeType || 'video/webm';
      const blob = new Blob(chunks, { type });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'kerstbomen-optuigen.' + (type.includes('mp4') ? 'mp4' : 'webm');
      a.click();
      recBtn.disabled = false; statusEl.textContent = 'Video klaar!';
    };
    t0 = performance.now(); last = 0; paused = false; pauseBtn.textContent = '❚❚ Pauze';
    recBtn.disabled = true;
    statusEl.textContent = `Bezig met opnemen… (${Math.round(LOOP)} seconden)`;
    rec.start();
    setTimeout(() => rec.stop(), LOOP * 1000 - 100);
  };

  // Tijd overschrijven via ?t=12 (handig voor stilstaande beelden)
  const qt = parseFloat(new URLSearchParams(location.search).get('t'));
  if (!isNaN(qt)) { paused = true; pausedAt = qt; }

  window.__render = (t) => render(t, 0.016);
  window.__setT = (t) => { paused = true; pausedAt = t; };
  requestAnimationFrame(frame);
})();
</script>
</body>
